name: Build DouyuWatermelon APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Decode Ninja Icon
        run: |
            mkdir -p app/src/main/res/drawable-nodpi
            echo "" | base64 -d > app/src/main/res/drawable-nodpi/ic_launcher_ninja.webp
      - name: Decode Keystore
        env:
          SIGN_B64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGN_B64" ]; then
            echo "$SIGN_B64" | base64 -d > app/release.jks
          fi
      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DouyuWatermelon-APK
          path: app/build/outputs/apk/release/*.apk
